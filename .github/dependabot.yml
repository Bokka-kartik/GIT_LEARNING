version: 2

# Dependabot only OPENS PRs. Nothing is auto-merged; you review and merge by hand.
# Major version bumps are ignored on purpose (they usually need code changes).
# Remove an "ignore" entry later when you are ready to take on a major upgrade.

updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
    groups:
      # one PR for all minor/patch bumps instead of one PR per package
      npm-minor-patch:
        update-types: ["minor", "patch"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
    groups:
      actions-minor-patch:
        update-types: ["minor", "patch"]
