name: Snyk

# Scans npm dependencies for known vulnerabilities and publishes results to GitHub Security.
on:
  pull_request:
  schedule:
    # weekly scan of the default branch catches newly disclosed vulnerabilities
    - cron: "0 6 * * 1"

permissions:
  contents: read
  security-events: write

concurrency:
  group: snyk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  security:
    name: Snyk open source scan
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      # continue-on-error allows the SARIF report to be uploaded even when vulnerabilities are found
      - name: Run Snyk to check for vulnerabilities
        uses: snyk/actions/node@master
        continue-on-error: true
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        with:
          args: --sarif-file-output=snyk.sarif

      - name: Upload Snyk scan results to GitHub Code Scanning
        uses: github/codeql-action/upload-sarif@v3
        if: hashFiles('snyk.sarif') != ''
        with:
          sarif_file: snyk.sarif

