name: CI

on:
  # if you want to build and test the overall changes on push then this need to be uncommented
  # but its a waste of check cuz only when a PR is raised then only a better suitable CI check is needed not wasting resources
  # push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
# my given name is validate we can have any name here let it be build,test,deploy check anything 
  validate:
    name: Test, lint, and build
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Run lint
        run: npm run lint

      - name: Build application
        run: npm run build
